# Actualización diaria de PokéPrice: colecciones nuevas, precios de todas las tiendas y publicación de la web.
# La base de datos (con todo el historial de precios) vive en la rama "datos", que se reescribe cada día
# sin historial de git: así el repositorio no crece aunque la base pese varios MB.
name: Actualización diaria
run-name: ${{ inputs.modo == 'publicar' && 'Publicar web (datos leídos desde el Mac)' || 'Actualización diaria' }}

on:
  schedule:
    # 06:15 en Madrid en invierno, 07:15 en verano. GitHub a veces la retrasa muchas horas: el Mac la lanza
    # él mismo por la mañana si aún no ha empezado, y entonces la programada no repite el trabajo.
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo = leer tiendas y publicar · publicar = sólo regenerar la web con la base de datos actual'
        type: choice
        options: [completo, publicar]
        default: completo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pokeprice-daily
  cancel-in-progress: false

jobs:
  # La tarea programada no hace nada si hoy ya se actualizó (lanzada desde el Mac o a mano)
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.hoy.outputs.skip }}
    steps:
      - id: hoy
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hoy=$(TZ=Europe/Madrid date +%F)
            msg=$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" datos > /dev/null && \
              git init -q /tmp/r && git -C /tmp/r fetch -q --depth 1 --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" datos && \
              git -C /tmp/r log -1 --format=%s FETCH_HEAD || true)
            echo "Última versión de los datos: $msg"
            case "$msg" in *"$hoy"*) skip=true; echo "Hoy ya se actualizó: no se repite." ;; esac
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Recuperar la base de datos de ayer
        run: |
          if git ls-remote --exit-code origin datos > /dev/null; then
            git fetch --depth 1 origin datos
            git show FETCH_HEAD:pokeprice.db > data/pokeprice.db
            echo "Base de datos recuperada ($(du -h data/pokeprice.db | cut -f1))"
          else
            echo "Primera ejecución: se crea una base de datos nueva"
          fi

      - name: Leer tiendas y actualizar precios
        if: ${{ inputs.modo != 'publicar' }}
        run: npm run update

      - name: Sólo publicar (datos ya actualizados desde el Mac)
        if: ${{ inputs.modo == 'publicar' }}
        run: npm run export

      - name: Guardar la base de datos en la rama "datos"
        if: ${{ inputs.modo != 'publicar' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/datos
          cp data/pokeprice.db data/unmatched.txt /tmp/datos/
          cd /tmp/datos
          git init -q -b datos
          git add .
          git -c user.name="pokeprice-bot" -c user.email="pokeprice-bot@users.noreply.github.com" commit -qm "Datos del $(TZ=Europe/Madrid date +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
